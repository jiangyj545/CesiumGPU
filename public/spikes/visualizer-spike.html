<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spike: 实体渲染桥接 (T2.2) — EntityVisualizer + OverlayPass</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #stats {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #dfe7ef;
      font: 12px/1.7 Consolas, monospace;
      white-space: pre;
      z-index: 10;
    }
    #toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    #toolbar button {
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #dfe7ef;
      font: 12px Consolas, monospace;
      cursor: pointer;
    }
    #toolbar button:hover { background: rgba(60, 90, 130, 0.8); }
    #title {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #dfe7ef;
      font: 12px/1.6 Consolas, monospace;
      text-align: center;
      z-index: 10;
    }
    #error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      background: rgba(80, 0, 0, 0.9);
      color: #ffdddd;
      border-radius: 8px;
      font: 13px/1.6 Consolas, monospace;
      max-width: 70%;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <pre id="stats">initialising...</pre>
  <div id="toolbar">
    <button data-view="china">中国 · 6 000 km</button>
    <button data-view="north">华北 · 2 000 km</button>
    <button data-view="street">北京 · 100 km</button>
    <button data-view="back">背面遮挡测试 · 非洲</button>
  </div>
  <div id="title">
    SPIKE — entity visualisation bridge (T2.2)<br />
    polygon → G-Buffer / WBOIT · polyline → WBOIT<br />
    point + label → OverlayPass (screen space, depth-tested)
  </div>
  <div id="error"></div>
  <!-- Vite dev server transforms /src/** TS on request (same pattern as other spikes) -->
  <script type="module" src="/src/spikes/visualizer-spike.ts"></script>
</body>
</html>
