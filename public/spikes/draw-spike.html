<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spike: 绘制交互 DrawHandler (点/线/面/矩形)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #cesiumContainer { width: 100%; height: 100%; position: relative; }
    #toolbar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      z-index: 10;
    }
    #toolbar button {
      padding: 6px 14px;
      font: 13px/1.4 Consolas, Monaco, monospace;
      color: #d8e0e8;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 5px;
      cursor: pointer;
    }
    #toolbar button:hover { background: rgba(255, 255, 255, 0.16); }
    #toolbar button.active {
      background: #1f6feb;
      border-color: #4a95ff;
      color: #fff;
      font-weight: bold;
    }
    #stats {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #8ecafc;
      font: 12px/1.7 Consolas, Monaco, monospace;
      pointer-events: none;
      z-index: 10;
    }
    #drawInfo {
      position: absolute;
      top: 64px;
      right: 12px;
      min-width: 260px;
      max-width: 340px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #d8f0d8;
      font: 12px/1.7 Consolas, Monaco, monospace;
      white-space: pre;
      pointer-events: none;
      z-index: 10;
    }
    #title {
      position: absolute;
      bottom: 12px;
      right: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #aaa;
      font: 11px/1.6 Consolas, Monaco, monospace;
      text-align: right;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="toolbar">
    <button data-type="point">画点</button>
    <button data-type="polyline">画线</button>
    <button data-type="polygon">画面</button>
    <button data-type="rectangle">画矩形</button>
    <button id="btn-clear">清除</button>
  </div>
  <div id="stats">初始化中…</div>
  <div id="drawInfo">模式: 空闲</div>
  <div id="title">Spike: DrawHandler 绘制交互<br />src/handler/DrawHandler.ts<br />左键取点 · 右键/双击结束 · 滚轮缩放</div>
  <script type="module" src="/src/spikes/draw-spike.ts"></script>
</body>
</html>
