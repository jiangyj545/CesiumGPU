<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spike: 天气特效 — 雨 / 雪 (Weather)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #stats {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #d8f0d8;
      font: 12px/1.7 Consolas, Monaco, monospace;
      white-space: pre;
      pointer-events: none;
      z-index: 10;
    }
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #ccc;
      font: 12px/1.6 Consolas, Monaco, monospace;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 190px;
    }
    #panel .row { display: flex; gap: 6px; }
    #panel button {
      flex: 1;
      padding: 6px 10px;
      background: #22303c;
      color: #cfe3ff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    #panel button:hover { background: #2c3e50; }
    #panel button.active { background: #1d6fa5; color: #fff; border-color: #7ec3ff; }
    #panel label { display: flex; flex-direction: column; gap: 2px; }
    #panel input[type="range"] { width: 100%; accent-color: #1d6fa5; }
    #error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      background: rgba(80, 0, 0, 0.9);
      color: #ffdddd;
      border-radius: 8px;
      font: 13px/1.6 Consolas, monospace;
      max-width: 70%;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <pre id="stats">initialising...</pre>
  <div id="panel">
    <div class="row">
      <button data-weather="rain">雨</button>
      <button data-weather="snow">雪</button>
      <button data-weather="off">停止</button>
    </div>
    <label>
      密度 <span id="densityValue">60%</span>
      <input id="density" type="range" min="0" max="1" step="0.01" value="0.6" />
    </label>
    <div>drag=旋转 · wheel=缩放</div>
  </div>
  <div id="error"></div>
  <!-- Vite dev server transforms /src/** TS on request (same pattern as particle-spike) -->
  <script type="module" src="/src/spikes/weather-spike.ts"></script>
</body>
</html>
