<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spike: CircleScan 圆形扫描特效（北京/上海）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #stats {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #d8f0d8;
      font: 12px/1.7 Consolas, Monaco, monospace;
      white-space: pre;
      pointer-events: none;
      z-index: 10;
    }
    #title {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #aaa;
      font: 11px/1.6 Consolas, Monaco, monospace;
      text-align: right;
      pointer-events: none;
      z-index: 10;
    }
    #error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      background: rgba(80, 0, 0, 0.9);
      color: #ffdddd;
      border-radius: 8px;
      font: 13px/1.6 Consolas, monospace;
      max-width: 70%;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <pre id="stats">initialising...</pre>
  <div id="title">
    SPIKE — CircleScan 圆形扫描特效 (T3.3)<br />
    北京: 500km 青 3环 / 2.5s · 上海: 250km 橙红 2环 / 1.6s<br />
    additive (one, one) · 贴椭球面极坐标圆盘<br />
    B / S 键切换两圈可见性
  </div>
  <div id="error"></div>
  <!-- Vite dev server transforms /src/** TS on request (same pattern as particle-spike) -->
  <script type="module" src="/src/spikes/scan-spike.ts"></script>
</body>
</html>
