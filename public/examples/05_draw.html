<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例 05：绘制交互 DrawHandler - CesiumGPU</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:260px;max-width:360px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin-bottom:4px;font-weight:600;}
    .cg-panel .desc{font-size:12px;line-height:1.6;color:#9db4d0;margin-bottom:8px;}
    .cg-panel #controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .cg-panel #controls button{padding:5px 12px;font-size:12px;cursor:pointer;color:#cfe4ff;
      background:rgba(40,80,140,.55);border:1px solid rgba(120,180,255,.35);border-radius:5px;}
    .cg-panel #controls button:hover{background:rgba(60,110,180,.75);}
    .cg-panel #controls button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel #result{font:12px/1.7 Consolas,Monaco,monospace;color:#b5e3a8;
      white-space:pre-wrap;max-height:260px;overflow:auto;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>05 绘制交互 DrawHandler</h1>
    <p class="desc">点 / 折线 / 多边形 / 矩形四种绘制模式。
      左键取点，右键或双击结束；绘制完成后可继续连画。</p>
    <div id="controls"></div>
    <div id="result">初始化中…</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    async function demo(viewer, engine) {
      const result = document.getElementById('result');
      const controls = document.getElementById('controls');
      function addBtn(label, onClick) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        controls.appendChild(btn);
        return btn;
      }

      /** 归一化 ECEF → "经度, 纬度"（度） */
      function toLonLat(p) {
        const c = engine.Cartographic.fromCartesian(p);
        const lon = (c.longitude * 180) / Math.PI;
        const lat = (c.latitude * 180) / Math.PI;
        return `${lon.toFixed(4)}, ${lat.toFixed(4)}`;
      }

      // ── DrawHandler：完成后的实体自动进入 scene.entities ───────────
      const draw = new engine.DrawHandler(viewer);
      const drawn = []; // 已绘制记录
      let mode = '空闲';

      function refresh(detail) {
        result.textContent =
          `模式: ${mode}\n实体数: ${viewer.scene.entities.length}\n` +
          `已绘制 ${drawn.length} 个:\n${drawn.join('\n')}` +
          (detail ? `\n${detail}` : '');
      }
      function setActive(typeLabel) {
        for (const btn of controls.querySelectorAll('button[data-type]')) {
          btn.classList.toggle('active', btn.dataset.type === typeLabel);
        }
      }

      const MODE_LABELS = { point: '画点', polyline: '画线', polygon: '画面', rectangle: '画矩形' };
      for (const type of Object.keys(MODE_LABELS)) {
        addBtn(MODE_LABELS[type], () => draw.start(type)).dataset.type = type;
      }
      addBtn('停止绘制', () => {
        draw.stop();
        mode = '空闲';
        setActive(null);
        refresh();
      });
      addBtn('清除全部', () => {
        viewer.scene.entities.removeAll();
        drawn.length = 0;
        mode = '空闲';
        setActive(null);
        refresh('已清空所有实体');
      });

      draw.drawStart.addListener((type) => {
        mode = `${MODE_LABELS[type]}（绘制中… 左键取点，右键/双击结束）`;
        setActive(type);
        refresh();
      });

      draw.drawEnd.addListener(({ positions, entity }) => {
        mode = `${entity.name}（可继续绘制）`;
        drawn.push(`#${drawn.length + 1} ${entity.name} 顶点${positions.length} @ ${toLonLat(positions[0])}`);
        refresh();
      });

      // ── Q4 精修：空闲态预置 1 点 + 1 线 + 1 面演示图形（可「清除全部」重绘）─
      const S = engine.Camera.EARTH_SCALE;
      const deg = (lon, lat, hM = 0) => {
        const p = engine.Cartesian3.fromDegrees(lon, lat, hM);
        return new engine.Cartesian3(p.x / S, p.y / S, p.z / S);
      };
      viewer.scene.entities.add({
        name: '演示点',
        position: deg(116.39, 39.9, 50_000),
        point: { color: new engine.Color(1, 0.35, 0.25, 1), pixelSize: 10 },
        label: { text: '演示点', fillColor: engine.Color.WHITE },
      });
      viewer.scene.entities.add({
        name: '演示线',
        polyline: {
          positions: [deg(115.2, 40.2, 100_000), deg(116.4, 40.8, 100_000), deg(117.6, 40.3, 100_000)],
          width: 3, color: new engine.Color(0.3, 0.85, 1.0, 0.95),
        },
      });
      viewer.scene.entities.add({
        name: '演示面',
        polygon: {
          hierarchy: { positions: [deg(115.6, 39.0), deg(116.8, 38.7), deg(116.6, 39.7)] },
          color: new engine.Color(0.35, 1.0, 0.5, 0.45),
        },
      });
      drawn.push('#1 演示点', '#2 演示线', '#3 演示面');

      viewer.camera.setView({
        destination: { lon: 116.39, lat: 39.9, height: 1_500_000 },
      });
      refresh('提示：点击上方按钮进入绘制模式');
    }

    // ── 标准启动模板（异步 IIFE：ES module 顶层不允许 return）────────
    (async () => {
      let viewer;
      try {
        ({ viewer } = await DemoUtils.startup({
          engine,
          view: [116.39, 39.9, 1_500_000],
          imagery: 'gaode-sat',
          title: '05 · 绘制交互 DrawHandler',
        }));
      } catch (err) {
        window.__DEMO_OK = false;
        return; // 错误面板已由 DemoUtils 显示（无 WebGPU 环境属正常降级）
      }
      try {
        await demo(viewer, engine);
        DemoUtils.showCode(demo, '05 绘制交互 · 核心代码');
        window.__DEMO_OK = true;
      } catch (err) {
        window.__DEMO_OK = false;
        DemoUtils.showError('示例逻辑执行失败', err);
      }
    })();
  </script>
</body>
</html>
