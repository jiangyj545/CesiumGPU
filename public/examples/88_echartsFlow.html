<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例 88：echarts 飞线近似 EchartsFlow - CesiumGPU</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:270px;max-width:400px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin-bottom:4px;font-weight:600;}
    .cg-panel .desc{font-size:12px;line-height:1.6;color:#9db4d0;margin-bottom:8px;}
    .cg-panel #controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .cg-panel #controls button{padding:5px 12px;font-size:12px;cursor:pointer;color:#cfe4ff;
      background:rgba(40,80,140,.55);border:1px solid rgba(120,180,255,.35);border-radius:5px;}
    .cg-panel #controls button:hover{background:rgba(60,110,180,.75);}
    .cg-panel #controls button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel #result{font:12px/1.7 Consolas,Monaco,monospace;color:#b5e3a8;
      white-space:pre-wrap;max-height:160px;overflow:auto;}
    /* canvas 叠加层：盖在 WebGL canvas 之上，不拦截鼠标 */
    #overlay{position:absolute;inset:0;z-index:500;pointer-events:none;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>88 echarts 飞线近似</h1>
    <p class="desc">迁移自 EV-Globe 15_echartsFlow。
      不引入 echarts：绝对定位 canvas 2D 叠加层（不进 WebGPU 管线）绘制
      青蓝渐变城市飞线、白色亮头飞点、目标涟漪扩散与左上角迷你流量柱图。</p>
    <div id="controls"></div>
    <div id="result">初始化中…</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    async function demo(viewer, engine) {
      const C3 = engine.Cartesian3;
      const result = document.getElementById('result');
      const controls = document.getElementById('controls');
      function addBtn(label, onClick) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        controls.appendChild(btn);
        return btn;
      }

      // ── canvas 2D 叠加层 ──────────────────────────────────────────────
      const overlay = document.createElement('canvas');
      overlay.id = 'overlay';
      document.getElementById('cesiumContainer').appendChild(overlay);
      const ctx = overlay.getContext('2d');

      /** 世界点（米制 ECEF）→ 屏幕 CSS 像素；相机背后返回 null */
      function toPixel(world) {
        const vp = viewer.scene.camera.viewProjectionMatrix.values;
        const cx = vp[0] * world.x + vp[4] * world.y + vp[8] * world.z + vp[12];
        const cy = vp[1] * world.x + vp[5] * world.y + vp[9] * world.z + vp[13];
        const cw = vp[3] * world.x + vp[7] * world.y + vp[11] * world.z + vp[15];
        if (cw <= 0) return null;
        return [
          ((cx / cw) * 0.5 + 0.5) * overlay.clientWidth,
          (0.5 - (cy / cw) * 0.5) * overlay.clientHeight,
        ];
      }
      const lonLat = (lon, lat) => C3.fromDegrees(lon, lat, 0);

      function syncSize() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(overlay.clientWidth * dpr);
        const h = Math.round(overlay.clientHeight * dpr);
        if (overlay.width !== w || overlay.height !== h) {
          overlay.width = w;
          overlay.height = h;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // ── 数据：城市 / 飞线（含流量权重）────────────────────────────────
      const CITIES = {
        北京: [116.40, 39.90], 上海: [121.47, 31.23], 广州: [113.26, 23.13],
        成都: [104.07, 30.67], 西安: [108.94, 34.34], 武汉: [114.30, 30.59],
        哈尔滨: [126.63, 45.75], 乌鲁木齐: [87.62, 43.82],
      };
      // [起, 终, 流量值 0-100]
      const FLOWS = [
        ['北京', '上海', 92], ['北京', '广州', 78], ['上海', '成都', 66],
        ['北京', '乌鲁木齐', 54], ['上海', '哈尔滨', 61], ['广州', '武汉', 47],
        ['西安', '北京', 39], ['成都', '乌鲁木齐', 33],
      ];
      const ALT = 260_000;                        // 弧顶抬升

      // ── 绘制 ──────────────────────────────────────────────────────────
      let showLines = true, showRipple = true, showChart = true;
      let paused = false;
      let elapsed = 0;

      const bez = (p0, p1, p2, u) => {
        const a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
        return [a * p0[0] + b * p1[0] + c * p2[0],
          a * p0[1] + b * p1[1] + c * p2[1]];
      };
      function arcCtrl(from, to) {
        return [toPixel(lonLat(...from)),
          toPixel(lonLat((from[0] + to[0]) / 2, (from[1] + to[1]) / 2, ALT)),
          toPixel(lonLat(...to))];
      }

      function drawFlowLines() {
        FLOWS.forEach(([fa, ta, val], idx) => {
          const [p0, p1, p2] = arcCtrl(CITIES[fa], CITIES[ta]);
          if (!p0 || !p1 || !p2) return;
          const SEG = 16;
          // 青蓝渐变弧线：线宽随流量
          ctx.lineWidth = 1 + (val / 100) * 1.6;
          for (let i = 0; i < SEG; i++) {
            const t1 = (i + 1) / SEG;
            const q0 = bez(p0, p1, p2, i / SEG), q1 = bez(p0, p1, p2, t1);
            // 青绿 → 蓝，透明度渐增（echarts lines effect 经典配色）
            const r = Math.round(40 + 60 * t1);
            const g = Math.round(220 - 120 * t1);
            const b = Math.round(180 + 60 * t1);
            ctx.strokeStyle = `rgba(${r},${g},${b},${(0.25 + 0.45 * t1).toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(q0[0], q0[1]);
            ctx.lineTo(q1[0], q1[1]);
            ctx.stroke();
          }
          // 双飞点（白色亮头 + 青色尾迹）
          for (let k = 0; k < 2; k++) {
            const u = (elapsed * (0.08 + val / 1600) + idx * 0.27 + k * 0.5) % 1;
            for (let s = 0; s < 10; s++) {
              const uu = u - s * 0.014;
              if (uu < 0) continue;
              const q = bez(p0, p1, p2, uu);
              const a = (1 - s / 10) * 0.95;
              ctx.fillStyle = s === 0
                ? `rgba(255,255,255,${a.toFixed(3)})`
                : `rgba(120,230,255,${(a * 0.7).toFixed(3)})`;
              ctx.beginPath();
              ctx.arc(q[0], q[1], Math.max(s === 0 ? 3.4 : 2.6 - s * 0.22, 0.5),
                0, Math.PI * 2);
              ctx.fill();
            }
          }
        });
      }

      function drawRipples() {
        let i = 0;
        for (const [name, [lon, lat]] of Object.entries(CITIES)) {
          const p = toPixel(lonLat(lon, lat));
          if (!p) { i++; continue; }
          for (let k = 0; k < 3; k++) {           // 三圈相位差涟漪
            const phase = (elapsed * 0.55 + i * 0.21 + k / 3) % 1;
            ctx.strokeStyle = `rgba(80,200,255,${(0.7 * (1 - phase)).toFixed(3)})`;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(p[0], p[1], 3 + phase * 16, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.fillStyle = 'rgba(160,230,255,0.95)';
          ctx.beginPath();
          ctx.arc(p[0], p[1], 2.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(220,245,255,0.85)';
          ctx.font = '12px sans-serif';
          ctx.fillText(name, p[0] + 7, p[1] - 7);
          i++;
        }
      }

      /** 左上角迷你流量柱图（echarts bar 近似，呼吸动画） */
      function drawMiniChart() {
        const x0 = 16, y0 = 26;
        const bw = 16, gap = 8;
        const maxH = 74;
        ctx.fillStyle = 'rgba(8,14,24,0.55)';
        ctx.fillRect(x0 - 8, y0 - 18, FLOWS.length * (bw + gap) + 14, maxH + 34);
        ctx.fillStyle = 'rgba(140,220,255,0.9)';
        ctx.font = '12px sans-serif';
        ctx.fillText('线路流量 TOP', x0, y0 - 4);
        FLOWS.forEach(([, ta, val], i) => {
          const breathe = 0.9 + 0.1 * Math.sin(elapsed * 2 + i);
          const h = (val / 100) * maxH * breathe;
          const x = x0 + i * (bw + gap);
          const grad = ctx.createLinearGradient(0, y0 + maxH - h, 0, y0 + maxH);
          grad.addColorStop(0, 'rgba(140,230,255,0.95)');
          grad.addColorStop(1, 'rgba(40,110,220,0.55)');
          ctx.fillStyle = grad;
          ctx.fillRect(x, y0 + maxH - h, bw, h);
          ctx.fillStyle = 'rgba(200,235,255,0.75)';
          ctx.font = '10px sans-serif';
          ctx.fillText(ta, x - 1, y0 + maxH + 12);
        });
      }

      // ── 逐帧驱动（与引擎渲染同步）─────────────────────────────────────
      let lastMs = performance.now();
      viewer.preRender = () => {
        const now = performance.now();
        const dt = Math.min((now - lastMs) / 1000, 0.05);
        lastMs = now;
        if (!paused) elapsed += dt;
        syncSize();
        ctx.clearRect(0, 0, overlay.clientWidth, overlay.clientHeight);
        if (showLines) drawFlowLines();
        if (showRipple) drawRipples();
        if (showChart) drawMiniChart();
      };

      // ── 交互 ──────────────────────────────────────────────────────────
      const mkToggle = (label, get, set) => {
        const btn = addBtn(label, () => {
          set(!get());
          btn.textContent = get() ? label : label + '（关）';
          btn.classList.toggle('active', get());
        });
        btn.classList.add('active');
      };
      mkToggle('飞线', () => showLines, (v) => { showLines = v; });
      mkToggle('涟漪', () => showRipple, (v) => { showRipple = v; });
      mkToggle('流量柱图', () => showChart, (v) => { showChart = v; });
      mkToggle('动画', () => !paused, (v) => { paused = !v; });

      function refresh() {
        result.textContent =
          `城市: ${Object.keys(CITIES).length}   飞线: ${FLOWS.length} 条   ` +
          `涟漪: 8 城 × 3 圈\n` +
          '渲染: DOM canvas 2D（不进 WebGPU 管线），未引入 echarts\n' +
          '配色: 青蓝渐变飞线 + 白色亮头飞点（echarts lines 风格）';
      }
      refresh();

      viewer.camera.setView({
        destination: C3.fromDegrees(107, 35.5, 6_500_000),
      });
    }

    // ── 标准启动模板（异步 IIFE：ES module 顶层不允许 return）────────
    (async () => {
      let viewer;
      try {
        ({ viewer } = await DemoUtils.startup({
          engine,
          view: [107, 35.5, 6_500_000],
          imagery: 'gaode-sat',
          title: '88 · echarts 飞线近似',
        }));
      } catch (err) {
        window.__DEMO_OK = false;
        return; // 错误面板已由 DemoUtils 显示（无 WebGPU 环境属正常降级）
      }
      try {
        await demo(viewer, engine);
        DemoUtils.showCode(demo, '88 echarts 飞线近似 · 核心代码');
        window.__DEMO_OK = true;
      } catch (err) {
        window.__DEMO_OK = false;
        DemoUtils.showError('示例逻辑执行失败', err);
      }
    })();
  </script>
</body>
</html>
