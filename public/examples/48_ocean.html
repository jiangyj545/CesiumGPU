<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>48 海洋效果 Ocean · CesiumGPU 示例</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:250px;max-width:340px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);
      font:13px/1.7 system-ui,sans-serif;}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin:0 0 6px;}
    .cg-panel .desc{font-size:12px;color:#9db8d8;margin:0 0 10px;}
    .cg-panel button{margin:2px 4px 2px 0;padding:3px 10px;font-size:12px;cursor:pointer;
      background:rgba(40,80,140,.55);color:#d8e8ff;border:1px solid rgba(120,180,255,.35);
      border-radius:5px;}
    .cg-panel button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel label{display:block;font-size:12px;color:#9db8d8;margin-top:6px;}
    #info{font:12px/1.6 Consolas,monospace;color:#b5e3a8;white-space:pre-wrap;margin-top:8px;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>48 海洋效果 Ocean</h1>
    <p class="desc">DynamicWater 大面积海域应用：南海开阔海域，海拔 520 m 掠海机位迎向太阳（轨迹 glitter 光带）。切换"平静/涌浪/风暴"三种海况，观察波光、白沫与海天雾接。</p>
    <div id="controls">
      <button id="btnShow" class="active">海面 显/隐</button>
      <button data-sea="calm">平静</button>
      <button data-sea="swell" class="active">涌浪</button>
      <button data-sea="storm">风暴</button>
      <label>波速 <input id="speed" type="range" min="0" max="4" step="0.1" value="1.6" style="width:130px"> <span id="speedVal">1.6x</span></label>
    </div>
    <div id="info">初始化中…</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    // 经纬度（度）→ 归一化 ECEF 地表点
    const A = 6378137.0, B = 6356752.3142;
    const E2 = (A * A - B * B) / (A * A), D2R = Math.PI / 180;
    function lonLat(lat_, lon_) {
      const lat = lat_ * D2R, lon = lon_ * D2R, s = Math.sin(lat);
      const n = A / Math.sqrt(1 - E2 * s * s), xy = n * Math.cos(lat);
      return new engine.Cartesian3(xy * Math.cos(lon) / A, xy * Math.sin(lon) / A, n * (1 - E2) * s / A);
    }

    async function demo(viewer, engine) {
      const info = document.getElementById('info');

      // ── 太阳方位：南海 14°N 午后斜阳（方位 ~310°、仰角 ~24°）──────────
      // 方位沿用旧档（迎太阳机位看到 glitter 光带）；仰角 16°→24° 让日盘
      // 移出画面顶部，天空回到参考站的干净热带蓝（旧档 16° 时日盘 + 大光晕
      // 占满上半屏，天顶采样被眩光染白）。水面高光 / 大气天空 / 平行光同源。
      const SUN = [0.537, 0.508, 0.674];
      viewer.scene.lights[0].direction = [-SUN[0], -SUN[1], -SUN[2]];

      // ── 英雄机位：海拔 520 m、俯角 -8°、航向 310°（正对太阳）────────
      const HERO = { lon: 113.5, lat: 14, height: 520, heading: 310, pitch: -8 };
      viewer.camera.setView({
        destination: { lon: HERO.lon, lat: HERO.lat, height: HERO.height },
        orientation: { heading: HERO.heading * Math.PI / 180, pitch: HERO.pitch * Math.PI / 180 },
      });

      // ── 物理大气天空：海天同色 / 地平线过渡的基准。必须先于海面入队
      //    （effects 按顺序绘制，海面 alpha 混合叠在天空上）────────────
      const sky = new engine.AtmosphereSky(viewer.context, {
        sunDirection: SUN,
        starIntensity: 0,
        // 干净热带天：低气溶胶（mieScale 0.22）+ 日盘出画 → 天顶蓝、
        // 地平线灰白，避开旧档 16° 低日角的大片米黄眩光。
        // R3：地平线 L117/ B129 → 目标 L126 / B141，抬日照度与瑞利散射；
        // 水面雾常量（DynamicWaterShader SKY_HORIZON）随后按实测同步。
        sunIntensity: 9.6,
        sunDiskIntensity: 0.55,
        mieG: 0.80,
        mieScale: 0.22,
        rayleighScale: 1.08,
      });
      sky.setDepthView(() => viewer.scene.gbufferPass
        ? viewer.scene.gbufferPass.getDepthView()
        : null);
      viewer.scene.effects.add(sky);

      // ── 南海大范围矩形水域（凸四边形，扇形三角化 + 球面细分）──────────
      const seaRect = [lonLat(3, 106), lonLat(3, 121), lonLat(24, 121), lonLat(24, 106)];
      const ocean = new engine.DynamicWater(viewer.context, {
        positions: seaRect,
        color: [0.095, 0.375, 0.405, 0.96],     // 热带深海青绿（近景水体色）
        speed: 1.6, waveScale: 0.6, glint: 4.0,
        sunDirection: SUN,
        camera: viewer.camera,
      });
      viewer.scene.effects.add(ocean);

      // ── 海况预设 ─────────────────────────────────────────────────────
      const SEA_STATES = {
        calm:  { label: '平静', speed: 0.5, waveScale: 0.20, glint: 2.2, color: [0.105, 0.395, 0.420, 0.96] },
        swell: { label: '涌浪', speed: 1.6, waveScale: 0.60, glint: 4.0, color: [0.095, 0.375, 0.405, 0.96] },
        storm: { label: '风暴', speed: 3.4, waveScale: 1.1,  glint: 5.0, color: [0.080, 0.320, 0.350, 0.985] },
      };
      let state = 'swell';

      const btnShow = document.getElementById('btnShow');
      btnShow.addEventListener('click', () => {
        ocean.show = !ocean.show;
        btnShow.classList.toggle('active', ocean.show);
        refresh();
      });
      document.querySelectorAll('button[data-sea]').forEach(btn => {
        btn.addEventListener('click', () => {
          state = btn.dataset.sea;
          const s = SEA_STATES[state];
          ocean.speed = s.speed;
          ocean.waveScale = s.waveScale;
          ocean.glint = s.glint;
          ocean.color = s.color;
          speedEl.value = s.speed;
          document.getElementById('speedVal').textContent = s.speed.toFixed(1) + 'x';
          document.querySelectorAll('button[data-sea]').forEach(b => b.classList.toggle('active', b === btn));
          refresh();
        });
      });
      const speedEl = document.getElementById('speed');
      speedEl.addEventListener('input', () => {
        ocean.speed = Number(speedEl.value);
        document.getElementById('speedVal').textContent = ocean.speed.toFixed(1) + 'x';
        refresh();
      });

      function refresh() {
        const s = SEA_STATES[state];
        info.textContent =
          `海域: 南海矩形（106-121°E, 3-24°N）\n` +
          `海况: ${s.label}   海面: ${ocean.show ? '显示' : '隐藏'}\n` +
          `波速: ${ocean.speed.toFixed(1)}x   波高: ${ocean.waveScale.toFixed(2)}   高光: ${ocean.glint.toFixed(1)}`;
      }
      refresh();
    }

    DemoUtils.startup({ engine, title: '48 · 海洋效果 Ocean', view: [113.5, 14, 520], imagery: 'tianditu' })
      .then(({ viewer }) => demo(viewer, engine))
      .then(() => { window.__DEMO_OK = true; return DemoUtils.showCode(demo); })
      .catch(e => DemoUtils.showError?.(e?.message || String(e)) ?? console.error(e));
  </script>
</body>
</html>
