<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>模型小场景 · CesiumGPU 示例</title>
  <script src="./js/demo-utils.js"></script>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:300px;max-width:430px;
      background:rgba(8,20,36,.82);border:1px solid rgba(90,160,255,.35);border-radius:10px;
      padding:12px 14px;color:#dce8f8;font-size:12px;backdrop-filter:blur(4px);}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin-bottom:4px;font-weight:600;}
    .cg-panel .desc{font-size:12px;line-height:1.6;color:#9db4d0;margin-bottom:8px;}
    .cg-panel #controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .cg-panel #controls button{padding:5px 12px;font-size:12px;cursor:pointer;color:#cfe4ff;
      background:rgba(40,80,150,.5);border:1px solid rgba(90,160,255,.4);border-radius:6px;}
    .cg-panel #controls button:hover{background:rgba(60,110,180,.75);}
    .cg-panel #controls button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel #result{font:12px/1.7 Consolas,Monaco,monospace;color:#b5e3a8;
      white-space:pre-wrap;background:rgba(0,0,0,.25);border-radius:6px;padding:6px 8px;margin-top:6px;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>37 · 模型小场景（航母编队）</h1>
    <div class="desc">
      对齐 EV-Globe 06_smallScene：多模型组合摆放一个场景。本页用
      CVN-76 航母 + 护卫车 ×2 + 保障车 ×2 + 直-9 直升机
      在海面上摆一个编队锚泊阵型；支持逐模型显隐与视角/环绕控制。
      注：E3M 场景格式不支持，全部以 glTF Model 组合近似。
    </div>
    <div id="controls"></div>
    <div id="result">加载中…</div>
  </div>
  <script type="module">
    import * as engine from '/src/index.ts';

    const ES = engine.Camera.EARTH_SCALE;
    const RHO = engine.Camera.WGS84_POLAR_RATIO;

    // 引擎可见世界是「线性压扁归一化 ECEF」：(cosφcosλ, ρ·cosφsinλ, ρ·sinφ)·(1+h/a)
    // （Globe/瓦片/相机 {lon,lat} 快捷同款）。fromDegrees 米制 WGS84 ECEF 与该面
    // 相差 ~22 km，模型会悬空远离可见地表——这里按压扁公式构造 ECEF 喂给 eNU
    // （内部 ÷EARTH_SCALE），平移分量正好落在可见海面上。
    function placeMatrix(lon, lat, hMeters, headingDeg) {
      const rad = Math.PI / 180, s = 1 + hMeters / ES;
      const ecef = new engine.Cartesian3(
        Math.cos(lat * rad) * Math.cos(lon * rad) * s * ES,
        Math.cos(lat * rad) * Math.sin(lon * rad) * RHO * s * ES,
        Math.sin(lat * rad) * RHO * s * ES);
      const enu  = engine.Transforms.eastNorthUpToFixedFrame(ecef);
      const rot  = engine.Matrix4.fromRotationZ(engine.CesiumMath.toRadians(headingDeg));
      const yUp  = engine.Matrix4.fromRotationX(Math.PI / 2);
      return engine.Matrix4.multiply(enu, engine.Matrix4.multiply(rot, yUp, new engine.Matrix4()),
                                     new engine.Matrix4());
    }

    async function demo(viewer, engine) {
      const result = document.getElementById('result');
      const controls = document.getElementById('controls');
      function addBtn(label, onClick) {
        const b = document.createElement('button');
        b.textContent = label;
        b.addEventListener('click', () => onClick(b));
        controls.appendChild(b);
        return b;
      }

      // ── 编队锚地：渤海湾海面 ────────────────────────────────────────
      // 偏移单位为米，小范围内用经纬度线性近似
      const CENTER = { lon: 119.30, lat: 38.60 };
      const rel = (dxM, dyM) => ({
        lon: CENTER.lon + dxM / 111_320 / Math.cos(CENTER.lat * Math.PI / 180),
        lat: CENTER.lat + dyM / 110_540,
      });

      // 模型清单：相对航母中心的摆放位置（米）/ 朝向 / scale
      // 注意 scale 语义是「米 / glTF 本地单位」（世界尺寸 = 本地几何 × scale），
      // 不是最终米数：ligen 长轴 134.3 单位、GroundVehicle.glb 全模 8.6 单位、
      // groundvehicle.gltf 8.74 单位、z9 机身 14.3 单位（z901 节点 0.007769
      // 已含），据此校准到 ≈ 目标视觉尺寸。
      // 注：J10C/MisYJ88 源模型为 KTX2 压缩纹理（引擎暂不支持）；DF26 的
      // BN2.gltf 顶点带 baked 偏移且装配几何呈薄片状（任何 scale 下都不可辨），
      // 均改用 GroundVehicle 护卫车辆替代。
      const DEFS = [
        { key: 'cvn',  label: 'CVN-76 航母', url: '/data/gltf/CVN-76/ligen.gltf',
          dx: 0,    dy: 0,    heading: 15,  size: 2.5 },                 // ≈336 m
        { key: 'j10a', label: '护卫车 1', url: '/data/model/GroundVehicle/GroundVehicle.glb',
          dx: -90,  dy: 40,   heading: 105, size: 3.5 },                 // ≈30 m
        { key: 'j10b', label: '护卫车 2', url: '/data/model/GroundVehicle/GroundVehicle.glb',
          dx: -90,  dy: -50,  heading: 105, size: 3.5 },                 // ≈30 m
        { key: 'yj1',  label: '保障车 ×1',  url: '/data/gltf/groundvehicle.gltf',
          dx: 260,  dy: 160,  heading: 200, size: 4.6 },                 // ≈40 m
        { key: 'yj2',  label: '保障车 ×2',  url: '/data/gltf/groundvehicle.gltf',
          dx: 280,  dy: -170, heading: 340, size: 4.6 },                 // ≈40 m
        { key: 'z9',   label: '直-9（悬停）', url: '/data/model/plane/z9.gltf',
          dx: 20,   dy: 10,   heading: 250, size: 1.8, alt: 180 },       // ≈26 m
      ];

      const models = {};   // key -> Model
      for (const def of DEFS) {
        const p = rel(def.dx, def.dy);
        models[def.key] = await engine.Model.fromGltfAsync({
          url: def.url,
          scene: viewer.scene,
          modelMatrix: placeMatrix(p.lon, p.lat, def.alt ?? 0, def.heading),
          scale: def.size / ES,
        });
      }

      function refreshInfo() {
        const parts = DEFS.map(d =>
          `${d.label}: ${models[d.key].show ? '显示' : '隐藏'} (${models[d.key].primitiveCount} prim)`);
        result.textContent =
          `场景: 渤海湾编队锚地 (${CENTER.lon}°E, ${CENTER.lat}°N)\n` + parts.join('\n') +
          `\n提示: 显隐按钮逐模型开关；视角按钮切换全景/甲板；环绕按钮自动盘旋`;
      }

      // ── 控件：显隐 / 视角 / 环绕 ────────────────────────────────────
      for (const def of DEFS) {
        const btn = addBtn(`${def.label}: 开`, () => {
          const m = models[def.key];
          m.show = !m.show;
          btn.textContent = `${def.label}: ${m.show ? '开' : '关'}`;
          btn.classList.toggle('active', m.show);
          refreshInfo();
        });
        btn.classList.add('active');
      }

      const panView = () => viewer.camera.flyTo({
        destination: { lon: CENTER.lon + 0.0001, lat: CENTER.lat - 0.00025, height: 180 },
        orientation: { heading: 0, pitch: engine.CesiumMath.toRadians(-68) },
        duration: 2,
      });
      const deckView = () => {
        const p = rel(-40, 0);
        viewer.camera.flyTo({
          destination: { lon: p.lon, lat: p.lat - 0.006, height: 900 },
          orientation: { heading: engine.CesiumMath.toRadians(10), pitch: engine.CesiumMath.toRadians(-22) },
          duration: 2,
        });
      };
      addBtn('视角: 全景', () => panView());
      addBtn('视角: 甲板', () => deckView());

      // 环绕：小范围用经纬圆近似绕航母中心盘旋
      let orbiting = false, orbitHeading = 0, orbitRaf = 0, lastNow = 0;
      const orbitBtn = addBtn('环绕: 关', () => {
        orbiting = !orbiting;
        orbitBtn.textContent = `环绕: ${orbiting ? '开' : '关'}`;
        orbitBtn.classList.toggle('active', orbiting);
        lastNow = performance.now();
        if (orbiting) requestAnimationFrame(orbitStep);
      });
      function orbitStep(now) {
        if (!orbiting) return;
        const dt = (now - lastNow) / 1000;
        lastNow = now;
        orbitHeading = (orbitHeading + dt * 6) % 360;    // 6°/s 盘旋
        const rM = 4500, hM = 3000;
        const rad = engine.CesiumMath.toRadians(orbitHeading);
        const p = rel(Math.sin(rad) * rM, -Math.cos(rad) * rM);
        viewer.camera.setView({
          destination: { lon: p.lon, lat: p.lat, height: hM },
          orientation: { heading: rad, pitch: engine.CesiumMath.toRadians(-33) },
        });
        orbitRaf = requestAnimationFrame(orbitStep);
      }
      window.addEventListener('beforeunload', () => cancelAnimationFrame(orbitRaf));

      panView();
      refreshInfo();
    }

    // ── 标准启动模板 ────────────────────────────────────────────────
    (async () => {
      let viewer;
      try {
        ({ viewer } = await DemoUtils.startup({
          engine,
          view: [119.30, 38.58, 5200],
          imagery: 'gaode-sat',
          title: '37 · 模型小场景',
        }));
      } catch (err) {
        window.__DEMO_OK = false;
        return;
      }
      try {
        await demo(viewer, engine);
        DemoUtils.showCode(demo, '37 模型小场景 · 核心代码');
        window.__DEMO_OK = true;
      } catch (err) {
        window.__DEMO_OK = false;
        DemoUtils.showError('示例逻辑执行失败', err);
      }
    })();
  </script>
</body>
</html>
