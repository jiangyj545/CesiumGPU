<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例 75：场景时间与昼夜 SceneTime - CesiumGPU</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:330px;max-width:430px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin-bottom:4px;font-weight:600;}
    .cg-panel .desc{font-size:12px;line-height:1.6;color:#9db4d0;margin-bottom:8px;}
    .cg-panel label{display:block;font-size:12px;color:#9db4d0;margin:6px 0 2px;}
    .cg-panel input[type=range]{width:100%;}
    .cg-panel #controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
    .cg-panel #controls button, .cg-panel select{padding:5px 10px;font-size:12px;cursor:pointer;
      color:#cfe4ff;background:rgba(40,80,140,.55);border:1px solid rgba(120,180,255,.35);
      border-radius:5px;}
    .cg-panel #controls button:hover{background:rgba(60,110,180,.75);}
    .cg-panel #result{font:12px/1.8 Consolas,Monaco,monospace;color:#b5e3a8;
      white-space:pre-wrap;margin-top:8px;}
    /* 底部时间轴 HUD */
    #timeHud{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9000;
      padding:8px 16px;background:rgba(8,14,26,.85);border:1px solid rgba(120,180,255,.3);
      border-radius:8px;text-align:center;min-width:320px;}
    #timeText{font:15px/1.5 Consolas,Monaco,monospace;color:#9fe8ff;}
    #timeSub{font:11px/1.6 Consolas,Monaco,monospace;color:#8fa8c8;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>75 场景时间与昼夜</h1>
    <p class="desc">引擎 <code>Clock</code> 驱动模拟时间（multiplier 倍速推进），
      每帧经 <code>SunPosition.computeSunDirection(currentTime)</code> 更新
      <code>scene.lights[0].direction</code> —— 昼夜晨昏线随时间扫过地球。
      拖动时刻/日期滑杆或点预设按钮观察光照变化。</p>
    <label>时刻（UTC+8 0-24h）<span id="hourVal">12.0</span></label>
    <input id="hourSlider" type="range" min="0" max="24" step="0.05" value="12" />
    <label>日期（2024 年第 <span id="dayVal">173</span> 天）</label>
    <input id="daySlider" type="range" min="1" max="366" step="1" value="173" />
    <div id="controls">
      <button id="playBtn">⏸ 暂停</button>
      <select id="speedSel">
        <option value="1">1×</option>
        <option value="60">60×（1秒=1分）</option>
        <option value="600" selected>600×（1秒=10分）</option>
        <option value="3600">3600×（1秒=1时）</option>
      </select>
      <button data-preset="noon">正午</button>
      <button data-preset="midnight">子夜</button>
      <button data-preset="summer">夏至</button>
      <button data-preset="winter">冬至</button>
    </div>
    <div id="result">初始化中…</div>
  </div>
  <div id="timeHud">
    <div id="timeText">--:--:--</div>
    <div id="timeSub">太阳直射点 --</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    async function demo(viewer, engine) {
      const result = document.getElementById('result');
      const hourSlider = document.getElementById('hourSlider');
      const daySlider = document.getElementById('daySlider');
      const hourVal = document.getElementById('hourVal');
      const dayVal = document.getElementById('dayVal');
      const playBtn = document.getElementById('playBtn');
      const speedSel = document.getElementById('speedSel');
      const timeText = document.getElementById('timeText');
      const timeSub = document.getElementById('timeSub');

      // ── 1. 模拟时间基准：2024 年（UTC+8 展示）───────────────────────
      const YEAR = 2024, TZ = 8; // 东八区
      const sun = viewer.scene.lights[0]; // Scene.initialize() 内置的默认太阳光
      const clock = new engine.Clock({
        multiplier: 600,
        shouldAnimate: true,
      });

      // 「年积日 day + 当地小时 h」→ JulianDate（用 UTC 计算避免时区歧义：
      // 把 UTC+8 的当地时刻减 8 小时还原为真实 UTC 时刻）
      function julianFromSliders() {
        const d = new Date(Date.UTC(YEAR, 0, 1, 0, 0, 0));
        d.setUTCDate(daySlider.valueAsNumber);
        const minutesUtc = Math.round(hourSlider.valueAsNumber * 60) - TZ * 60;
        d.setUTCMinutes(minutesUtc);
        return engine.JulianDate.fromDate(d);
      }
      // JulianDate → 东八区墙钟字符串 + 年积日
      function fmt(jd) {
        const local = new Date(jd.toDate().getTime() + TZ * 3600_000);
        const p = (n) => String(n).padStart(2, '0');
        const startOfYear = Date.UTC(local.getUTCFullYear(), 0, 1);
        const dayOfYear = Math.floor((Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()) - startOfYear) / 86400_000) + 1;
        return {
          text: `${local.getUTCFullYear()}-${p(local.getUTCMonth() + 1)}-${p(local.getUTCDate())} ` +
                `${p(local.getUTCHours())}:${p(local.getUTCMinutes())}:${p(local.getUTCSeconds())}`,
          hour: local.getUTCHours() + local.getUTCMinutes() / 60 + local.getUTCSeconds() / 3600,
          dayOfYear,
        };
      }

      // ── 2. 每帧：Clock 推进 + 太阳方向联动 + HUD 刷新 ────────────────
      let hudTick = 0;
      viewer.preRender = () => {
        clock.tick();
        // DirectionalLight.direction 语义为“光指向场景”（Sun→Earth），与
        // SunPosition.computeSunDirection 的返回约定一致（Viewer 文档同款用法）
        sun.direction = engine.SunPosition.computeSunDirection(clock.currentTime);
        sun.ambientIntensity = 0.12; // 夜半球保留少量环境光便于观察

        if (++hudTick % 10 === 0) { // 10 帧一次足够，避免 DOM 抖动
          const { text, hour, dayOfYear } = fmt(clock.currentTime);
          timeText.textContent = text + ' (UTC+8)';
          const sub = engine.SunPosition.computeSubSolarPoint(clock.currentTime);
          timeSub.textContent =
            `太阳直射点 ${sub.longitude.toFixed(2)}°, ${sub.latitude.toFixed(2)}°  ` +
            `年积日 ${dayOfYear}  倍速 ${clock.multiplier}×`;
          // 回写滑杆（动画推进时保持同步；用户正拖动则跳过）
          if (document.activeElement !== hourSlider) hourSlider.value = hour.toFixed(2);
          if (document.activeElement !== daySlider) daySlider.value = String(dayOfYear);
          hourVal.textContent = hour.toFixed(1);
          dayVal.textContent = String(dayOfYear);
        }
      };

      // ── 3. 交互 ─────────────────────────────────────────────────────
      const applySliders = () => { clock.currentTime = julianFromSliders(); };
      hourSlider.addEventListener('input', applySliders);
      daySlider.addEventListener('input', applySliders);

      playBtn.addEventListener('click', () => {
        clock.shouldAnimate = !clock.shouldAnimate;
        playBtn.textContent = clock.shouldAnimate ? '⏸ 暂停' : '▶ 播放';
      });
      speedSel.addEventListener('change', () => { clock.multiplier = Number(speedSel.value); });

      function setPreset(hour, day) {
        hourSlider.value = String(hour);
        daySlider.value = String(day);
        clock.currentTime = julianFromSliders();
        result.textContent = `已跳到 2024 年第 ${day} 天 ${hour}:00（UTC+8）`;
      }
      const curDay = () => daySlider.valueAsNumber;
      document.querySelectorAll('button[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.preset;
          if (p === 'noon') setPreset(12, curDay());
          else if (p === 'midnight') setPreset(0, curDay());
          else if (p === 'summer') setPreset(12, 173);  // 2024-06-21 夏至
          else if (p === 'winter') setPreset(12, 356);  // 2024-12-21 冬至
        });
      });

      clock.currentTime = julianFromSliders();
      result.textContent = '拖动时刻滑杆看晨昏线扫过；点「播放」以 600× 推进时间。';
    }

    // ── 标准启动模板（异步 IIFE：ES module 顶层不允许 return）────────
    (async () => {
      let viewer;
      window.viewer = null; // debug hook for QA probes
      try {
        ({ viewer } = await DemoUtils.startup({
          engine,
          view: [105, 30, 16_000_000],
          imagery: 'tianditu',
          title: '75 · 场景时间与昼夜 SceneTime',
        }));
      } catch (err) {
        window.__DEMO_OK = false;
        return; // 错误面板已由 DemoUtils 显示（无 WebGPU 环境属正常降级）
      }
      try {
        window.viewer = viewer; // debug hook for QA probes
        await demo(viewer, engine);
        DemoUtils.showCode(demo, '75 场景时间 · 核心代码');
        window.__DEMO_OK = true;
      } catch (err) {
        window.__DEMO_OK = false;
        DemoUtils.showError('示例逻辑执行失败', err);
      }
    })();
  </script>
</body>
</html>
