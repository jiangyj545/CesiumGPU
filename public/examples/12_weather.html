<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例 12：雨雪天气 Weather - CesiumGPU</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:280px;max-width:380px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin-bottom:4px;font-weight:600;}
    .cg-panel .desc{font-size:12px;line-height:1.6;color:#9db4d0;margin-bottom:8px;}
    .cg-panel #controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .cg-panel #controls button{padding:5px 12px;font-size:12px;cursor:pointer;color:#cfe4ff;
      background:rgba(40,80,140,.55);border:1px solid rgba(120,180,255,.35);border-radius:5px;}
    .cg-panel #controls button:hover{background:rgba(60,110,180,.75);}
    .cg-panel #controls button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel #result{font:12px/1.7 Consolas,Monaco,monospace;color:#b5e3a8;
      white-space:pre-wrap;max-height:220px;overflow:auto;}
    .cg-panel .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
    .cg-panel input[type=range]{flex:1;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>12 雨雪天气</h1>
    <p class="desc">相机锚定的雨/雪粒子（Weather 特效）。雨雪粒子经 G-Buffer
      depthView 深度测试被地球与建筑遮挡；密度滑条实时调节强度。</p>
    <div id="controls"></div>
    <div class="row">密度<input id="density" type="range" min="0.05" max="1" step="0.05" value="0.6" /><span id="densityVal">60%</span></div>
    <div id="result">初始化中…</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    async function demo(viewer, engine) {
      const S = engine.Camera.EARTH_SCALE;
      const result = document.getElementById('result');
      const controls = document.getElementById('controls');
      function addBtn(label, onClick) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        controls.appendChild(btn);
        return btn;
      }

      // ── 近地视角：拉近平面（引擎默认 near ≈ 32 km，会裁掉相机周边天气体）──
      viewer.camera.frustum.near = 20 / S;
      viewer.camera.setView({
        destination: { lon: 116.4, lat: 39.9, height: 3_000 }, // 北京上空 3 km
        orientation: { pitch: engine.CesiumMath.toRadians(-65) },
      });

      // ── Weather 生命周期：雨/雪切换 = 销毁旧实例重建 ─────────────────────
      let weather = null;
      let currentType = null;
      let intensity = 0.6;

      function spawn(type) {
        if (weather) {
          viewer.scene.effects.remove(weather);
          weather.destroy();
        }
        weather = new engine.Weather(viewer.context, { type, intensity, sizeScale: 8 });
        weather.setCamera(viewer.camera);   // 粒子体跟随相机
        viewer.scene.effects.add(weather);
        weather.show = true;
        currentType = type;
        refresh();
      }

      function refresh() {
        const count = weather && currentType
          ? Math.round((currentType === 'rain' ? 20000 : 8000) * intensity)
          : 0;
        result.textContent =
          `天气: ${currentType === 'rain' ? '雨' : currentType === 'snow' ? '雪' : '停止'}   ` +
          `密度: ${Math.round(intensity * 100)}%\n` +
          `实例数: ${count.toLocaleString()}\n` +
          `遮挡: G-Buffer depthView 逐帧刷新（resize 后自动重绑）`;
      }

      const rainBtn = addBtn('雨', () => spawn('rain'));
      rainBtn.dataset.weather = 'rain';
      const snowBtn = addBtn('雪', () => spawn('snow'));
      snowBtn.dataset.weather = 'snow';
      const stopBtn = addBtn('停止', () => {
        if (weather) weather.show = false;
        currentType = null;
        refresh();
      });
      stopBtn.dataset.weather = 'stop';

      // ── 密度滑条：setIntensity 实时调节（不重建）────────────────────────
      const slider = document.getElementById('density');
      const densityVal = document.getElementById('densityVal');
      slider.addEventListener('input', () => {
        intensity = Number(slider.value);
        densityVal.textContent = `${Math.round(intensity * 100)}%`;
        weather?.setIntensity(intensity);
        refresh();
      });

      // ── 每帧刷新深度绑定（G-Buffer 在 resize 时重建）────────────────────
      viewer.preRender = () => {
        weather?.setDepthView(viewer.scene.gbufferPass?.textures.depthView ?? null);
      };

      spawn('rain');
    }

    // ── 标准启动模板（异步 IIFE：ES module 顶层不允许 return）────────
    (async () => {
      let viewer;
      try {
        ({ viewer } = await DemoUtils.startup({
          engine,
          view: [116.4, 39.9, 3_000],
          imagery: 'tianditu',
          title: '11 · 雨雪天气 Weather',
        }));
      } catch (err) {
        window.__DEMO_OK = false;
        return; // 错误面板已由 DemoUtils 显示（无 WebGPU 环境属正常降级）
      }
      try {
        await demo(viewer, engine);
        DemoUtils.showCode(demo, '11 雨雪天气 · 核心代码');
        window.__DEMO_OK = true;
      } catch (err) {
        window.__DEMO_OK = false;
        DemoUtils.showError('示例逻辑执行失败', err);
      }
    })();
  </script>
</body>
</html>
