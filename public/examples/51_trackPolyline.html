<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>51 航迹线回放 TrackPolyline · CesiumGPU 示例</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:260px;max-width:350px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);
      font:13px/1.7 system-ui,sans-serif;}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin:0 0 6px;}
    .cg-panel .desc{font-size:12px;color:#9db8d8;margin:0 0 10px;}
    .cg-panel button{margin:2px 4px 2px 0;padding:3px 10px;font-size:12px;cursor:pointer;
      background:rgba(40,80,140,.55);color:#d8e8ff;border:1px solid rgba(120,180,255,.35);
      border-radius:5px;}
    .cg-panel button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel label{display:block;font-size:12px;color:#9db8d8;margin-top:6px;}
    #info{font:12px/1.6 Consolas,monospace;color:#b5e3a8;white-space:pre-wrap;margin-top:8px;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>51 航迹线回放 TrackPolyline</h1>
    <p class="desc">读取 /data/trakline.json 历史航迹（含时间/经纬高/姿态），全轨迹淡显 + 已飞段高亮 + 领航点渐隐尾迹（6 级拖尾光点）。进度推进时逐段重建高亮线（definitionChanged 触发重建）。</p>
    <div id="controls">
      <button id="btnPlay" class="active">暂停</button>
      <button id="btnReset">重置</button>
      <button id="btnFollow">跟随: 关</button>
      <label>倍速 <input id="speed" type="range" min="0.5" max="8" step="0.5" value="2" style="width:130px"> <span id="speedVal">2.0x</span></label>
    </div>
    <div id="info">加载轨迹数据…</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    const A = 6378137.0, B = 6356752.3142;
    const E2 = (A * A - B * B) / (A * A), D2R = Math.PI / 180;
    function lonLat(lat_, lon_, hM = 0) {
      const lat = lat_ * D2R, lon = lon_ * D2R, s = Math.sin(lat);
      const n = A / Math.sqrt(1 - E2 * s * s), xy = (n + hM) * Math.cos(lat);
      return new engine.Cartesian3(xy * Math.cos(lon) / A, xy * Math.sin(lon) / A, (n * (1 - E2) + hM) * s / A);
    }

    async function demo(viewer, engine) {
      const info = document.getElementById('info');
      // ── 底图垫底：航迹全在东海海面（~131.4°E, 31.8°N），高德/Mapnik
      //    均无海洋瓦片 → 最底叠一层全局暗蓝单色底图（页面内
      //    SolidOceanProvider，鸭子类型实现 ImageryProvider 接口，参照
      //    17_localImage 的 SingleTileProvider 写法），陆地上 Mapnik/高德
      //    照常覆盖，海面瓦片 404 处透出蓝色海面 ─────────────────────
      class SolidOceanProvider {
        constructor() {
          this.url = 'solid-ocean://deep-blue';
          this._tile = null;                     // 懒建 1×256×256 纯色瓦片
        }
        get maximumLevel() { return 18; }
        get tileSize() { return 256; }
        get subdomains() { return []; }
        get ready() { return true; }
        resolveUrl() { return this.url; }
        async requestTile() {
          if (!this._tile) {
            const canvas = new OffscreenCanvas(256, 256);  // 契约要求 ImageBitmap
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgb(13, 36, 68)';
            ctx.fillRect(0, 0, 256, 256);
            this._tile = canvas.transferToImageBitmap();
          }
          return this._tile;
        }
      }
      const layers = viewer.globe.layers;
      const gaode = layers.get(0);   // startup 加载的高德卫星层
      // 高德海面是纯色占位瓦片（~129,135,120，画面"格网"的来源）且不透明，
      // 会盖住任何垫底层 → 用 SeaMaskXyzProvider 包装高德：纯色瓦片置空
      // 透出下层蓝海，真实陆地影像瓦片原样透传（顶替原高德层）。
      class SeaMaskXyzProvider {
        constructor(url, subdomains) {
          this._inner = new engine.XyzImageryProvider({
            url, subdomains, maximumLevel: 18, tileSize: 256,
          });
        }
        get url() { return this._inner.url; }
        get maximumLevel() { return this._inner.maximumLevel; }
        get tileSize() { return this._inner.tileSize; }
        get subdomains() { return this._inner.subdomains; }
        get ready() { return true; }
        resolveUrl(key) { return this._inner.resolveUrl(key); }
        async requestTile(key) {
          const bmp = await this._inner.requestTile(key);
          if (!bmp) return null;
          const canvas = new OffscreenCanvas(bmp.width, bmp.height);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bmp, 0, 0);
          const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          // 高德海上占位瓦片：均值 ≈ (129,135,120) 灰绿纯色 + JPEG 噪声
          //（对均值 ±15，个别像元到 ±22）。按「均值命中占位色板 ±10 且
          // 全图对均值偏差 ≤ 24」判定；真实陆地影像均值不落此色板。
          const sum = [0, 0, 0];
          let n = 0;
          for (let i = 0; i < d.length; i += 16) {  // 每 4 像元抽 1 检测
            sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; n++;
          }
          const mean = [sum[0] / n, sum[1] / n, sum[2] / n];
          const PLACEHOLDER = [129, 135, 120];
          const meanMatch = mean.every((v, k) => Math.abs(v - PLACEHOLDER[k]) < 10);
          if (meanMatch) {
            for (let i = 0; i < d.length; i += 16) {
              if (Math.abs(d[i] - mean[0]) > 48 || Math.abs(d[i + 1] - mean[1]) > 48 ||
                  Math.abs(d[i + 2] - mean[2]) > 48) {
                return canvas.transferToImageBitmap(); // 占位色但带强纹理
              }
            }
            return transparentTile();              // 占位→全透明：透出下层蓝海
          }
          return canvas.transferToImageBitmap();      // 非占位色：真实影像瓦片
        }
      }

      // 全透明瓦片：占位瓦片须回「透明」而非 null——null 会触发引擎的
      // 祖先瓦片上采样回退（陆域祖先盖住海面），透明则真正透出下层。
      function transparentTile() {
        const canvas = new OffscreenCanvas(256, 256);
        return canvas.transferToImageBitmap();
      }
      layers.addImageryProvider(new SolidOceanProvider());   // 底：全球暗蓝海面
      layers.addImageryProvider(new engine.XyzImageryProvider({  // 中：陆域细节
        url: 'http://127.0.0.1:8890/tiles/Mapnik/{z}/{x}/{y}.png',
        maximumLevel: 16, tileSize: 256,
      }));
      layers.addImageryProvider(new SeaMaskXyzProvider(  // 顶：过滤版高德卫星
        gaode.provider.url, gaode.provider.subdomains));
      layers.remove(gaode);
      let svcWarn = '';
      fetch('http://127.0.0.1:8890/tiles/Mapnik/3/6/3.png', { method: 'HEAD' })
        .then(r => { if (!r.ok) throw new Error(r.status); })
        .catch(() => {
          svcWarn = '⚠ 离线影像(8890)未启动，陆地无 Mapnik 细节（海面仍有蓝色底图）\n';
        });


      // ── 加载历史航迹（[{trackline:[{time,lon,lat,alt,…}]}]）────────────
      const resp = await fetch('/data/trakline.json');
      if (!resp.ok) throw new Error(`trakline.json 加载失败: HTTP ${resp.status}`);
      const data = await resp.json();
      const raw = (data[0]?.trackline ?? []).map(p => ({
        time: p.time, lon: p.lon, lat: p.lat, alt: p.alt ?? 100,
      }));
      if (raw.length < 2) throw new Error('trakline.json 无有效 trackline 点');
      const pts = raw.map(p => lonLat(p.lat, p.lon, p.alt));

      // 弧长表（进度 → 位置插值）
      const cum = [0];
      for (let i = 1; i < pts.length; i++) {
        cum.push(cum[i - 1] + engine.Cartesian3.distance(pts[i - 1], pts[i]));
      }
      const total = cum[cum.length - 1];
      function pointAt(s) {
        const target = Math.min(1, Math.max(0, s)) * total;
        let lo = 0, hi = cum.length - 1;
        while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
        const f = (target - cum[lo]) / (cum[hi] - cum[lo] || 1);
        const p0 = pts[lo], p1 = pts[hi];
        return new engine.Cartesian3(p0.x + (p1.x - p0.x) * f, p0.y + (p1.y - p0.y) * f, p0.z + (p1.z - p0.z) * f);
      }

      // ── 航迹渲染：FlowArrowPolyline 特效 ────────────────────────────
      // 注：当前工作区实体几何（polyline/point/polygon，含不透明）经
      // PrimitiveCollection 的绘制链路不显示（并发分支改动中），但特效
      // 管线（FlowArrow/FloodWater 等）正常 → 本页航迹/领航点全部走特效。
      const effects = viewer.scene.effects;
      function flowLine(material, width) {
        const f = new engine.FlowArrowPolyline(viewer.scene.context, { material, width });
        f.setCamera(viewer.scene.camera);
        effects.add(f);
        return f;
      }

      // 全轨迹淡显（青蓝底线 + 同色箭头）
      const fullLine = flowLine({
        type: 'flow',
        color: [0.3, 0.7, 1.0, 0.12],
        arrowColor: [0.4, 0.8, 1.0, 0.25],
        repeatCount: 40,
      }, 3);
      fullLine.setPositions(pts);

      // 已飞高亮线（进度推进 4% 时整体重建一次；橙底线 + 橙箭头）
      const flownLine = flowLine({
        type: 'flow',
        color: [1.0, 0.55, 0.1, 0.55],
        arrowColor: [1.0, 0.55, 0.1, 0.95],
        repeatCount: 40,
      }, 5);
      let flownMark = -1;
      function rebuildFlown(progress) {
        const step = Math.floor(progress * 25);
        if (step === flownMark) return;
        flownMark = step;
        const n = Math.max(2, Math.round(progress * (pts.length - 1)) + 1);
        flownLine.setPositions(pts.slice(0, n));
      }

      // 领航点 + 6 级渐隐尾迹：每级一段微小径向竖线（长 ~130 m），宽屏
      // 幅 10-16 px 屏幕空间恒定——30 km 跟随视角下即清晰光点，逐帧位移。
      function radialMarkerPair(p) {
        return [p, new engine.Cartesian3(p.x * 1.00002, p.y * 1.00002, p.z * 1.00002)];
      }
      const head = flowLine({
        type: 'flow', color: [1.0, 0.25, 0.15, 1.0],
        arrowColor: [1.0, 0.25, 0.15, 1.0], repeatCount: 1,
      }, 14);
      const TRAIL = 6;
      const trail = [];
      for (let i = 0; i < TRAIL; i++) {
        const fade = 1 - (i + 1) / (TRAIL + 1);
        trail.push(flowLine({
          type: 'flow',
          color: [1.0, 0.5 - fade * 0.2, 0.15, fade * 0.8],
          arrowColor: [1.0, 0.5 - fade * 0.2, 0.15, fade * 0.8],
          repeatCount: 1,
        }, Math.round(8 * fade) + 2));
      }
      head.setPositions(radialMarkerPair(pts[0]));
      for (const t of trail) t.setPositions(radialMarkerPair(pts[0]));

      // ── 回放控制 ─────────────────────────────────────────────────────
      // 默认开启跟随（30km 视角）：默认远视距下 4km 航迹投影 <2px 不可见，
      // 打开页面即以跟随视角看到航迹线与领航点（可点按钮关闭）。
      let playing = true, progress = 0, speed = 2.0, follow = true, last = performance.now();
      document.getElementById('btnFollow').textContent = '跟随: 开';
      document.getElementById('btnFollow').classList.add('active');
      rebuildFlown(0);

      viewer.preRender = () => {
        const now = performance.now();
        if (playing) {
          progress += (now - last) / 1000 * speed * 0.02;   // 默认 ~50s 完整回放
          if (progress >= 1) { progress = 1; playing = false; syncPlayBtn(); }
        }
        last = now;

        const headPos = pointAt(progress);
        head.setPositions(radialMarkerPair(headPos));
        for (let i = 0; i < TRAIL; i++) {
          trail[i].setPositions(radialMarkerPair(pointAt(Math.max(0, progress - (i + 1) * 0.008))));
        }
        rebuildFlown(progress);

        if (follow) {
          // 由归一化 ECEF 反算经纬度做视角跟随
          const r = headPos;
          const lat = Math.atan2(r.z, Math.hypot(r.x, r.y)) / D2R;
          const lon = Math.atan2(r.y, r.x) / D2R;
          viewer.camera.setView({ destination: { lon, lat, height: 30_000 } });
        }
        refresh(progress);
      };

      const btnPlay = document.getElementById('btnPlay');
      function syncPlayBtn() {
        btnPlay.textContent = playing ? '暂停' : '播放';
        btnPlay.classList.toggle('active', playing);
      }
      btnPlay.addEventListener('click', () => {
        if (!playing && progress >= 1) progress = 0;
        playing = !playing;
        syncPlayBtn();
      });
      document.getElementById('btnReset').addEventListener('click', () => {
        progress = 0; flownMark = -1; rebuildFlown(0); playing = true; syncPlayBtn();
      });
      const btnFollow = document.getElementById('btnFollow');
      btnFollow.addEventListener('click', () => {
        follow = !follow;
        btnFollow.textContent = '跟随: ' + (follow ? '开' : '关');
        btnFollow.classList.toggle('active', follow);
      });
      document.getElementById('speed').addEventListener('input', (e) => {
        speed = Number(e.target.value);
        document.getElementById('speedVal').textContent = speed.toFixed(1) + 'x';
      });

      function refresh(p) {
        const idx = Math.min(raw.length - 1, Math.round(p * (raw.length - 1)));
        const t = new Date(raw[idx].time);
        info.textContent = svcWarn +
          `点数: ${raw.length}   进度: ${(p * 100).toFixed(1)}%\n` +
          `时间: ${t.toISOString().slice(0, 19).replace('T', ' ')}\n` +
          `位置: ${raw[idx].lon.toFixed(3)}°E, ${raw[idx].lat.toFixed(3)}°N  高度 ${raw[idx].alt.toFixed(0)}m`;
      }
      refresh(0);
    }

    DemoUtils.startup({ engine, title: '51 · 航迹线回放 TrackPolyline', view: [131.4, 31.6, 320_000], imagery: 'tianditu' })
      .then(({ viewer }) => demo(viewer, engine))
      .then(() => { window.__DEMO_OK = true; return DemoUtils.showCode(demo); })
      .catch(e => DemoUtils.showError?.(e?.message || String(e)) ?? console.error(e));
  </script>
</body>
</html>
