<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例 86：路径分析 RouteAnalysis - CesiumGPU</title>
  <style>
    .cg-panel{position:absolute;top:12px;left:12px;z-index:9000;min-width:270px;max-width:400px;
      padding:12px 14px;background:rgba(10,18,30,.82);border:1px solid rgba(120,180,255,.25);
      border-radius:8px;color:#d8e8ff;box-shadow:0 2px 12px rgba(0,0,0,.45);}
    .cg-panel h1{font-size:15px;color:#8ecafc;margin-bottom:4px;font-weight:600;}
    .cg-panel .desc{font-size:12px;line-height:1.6;color:#9db4d0;margin-bottom:8px;}
    .cg-panel .mode-tag{display:inline-block;font-size:11px;line-height:1.5;margin-bottom:8px;
      padding:2px 8px;border-radius:4px;color:#b7f5c4;background:rgba(30,140,90,.25);
      border:1px solid rgba(74,222,128,.4);}
    .cg-panel #controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .cg-panel #controls button{padding:5px 12px;font-size:12px;cursor:pointer;color:#cfe4ff;
      background:rgba(40,80,140,.55);border:1px solid rgba(120,180,255,.35);border-radius:5px;}
    .cg-panel #controls button:hover{background:rgba(60,110,180,.75);}
    .cg-panel #controls button.active{background:rgba(30,140,90,.85);border-color:#4ade80;}
    .cg-panel #result{font:12px/1.7 Consolas,Monaco,monospace;color:#b5e3a8;
      white-space:pre-wrap;max-height:280px;overflow:auto;}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="cg-panel">
    <h1>86 路径分析</h1>
    <p class="desc">途经点（≥2 个）<b>优先请求后台 PostGIS 路网 Dijkstra 最短路径</b>
      （http://localhost:8892，路网覆盖武汉 114.20–114.40°E / 30.49–30.69°N）；
      后台不可达/超范围时自动回退 CatmullRomSpline 平滑航线。
      <b>绿色粗线 = 后台路网路径</b>，青色平滑线 = 前端近似(离线)。</p>
    <span class="mode-tag">后台 PostGIS 路网 Dijkstra</span>
    <div id="controls"></div>
    <div id="result">初始化中…</div>
  </div>
  <script src="./js/demo-utils.js"></script>
  <script type="module">
    import * as engine from '/src/index.ts';

    async function demo(viewer, engine) {

      // ── 地形层（湖北 7777 内网 quantized-mesh；断网降级 0 高椭球）──────
      fetch('http://192.168.0.200:7777/api/v1/terrain-3d/tiles/terrain_hubei/layer.json', { method: 'HEAD' })
        .then(r => { if (!r.ok) throw new Error(r.status); })
        .catch(() => console.warn('[demo] 内网地形服务(192.168.0.200:7777)不可达，运行在 0 高椭球'));
      try {
        if (typeof engine.TerrainLayer === 'function') {
          viewer.globe.setTerrainProvider(new engine.LocalQuantizedMeshProvider({
            url: 'http://192.168.0.200:7777/api/v1/terrain-3d/tiles/terrain_hubei/{z}/{x}/{y}.terrain',
            maximumLevel: 12, // 构建范围 max_zoom=12;14 会请求 z13/14 触发服务 429 限流→地形周期闪
          }));
        }
      } catch (err) { console.warn('[demo] terrain init failed:', err.message); }

      const C3 = engine.Cartesian3;
      const result = document.getElementById('result');
      const controls = document.getElementById('controls');
      function addBtn(label, onClick) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        controls.appendChild(btn);
        return btn;
      }

      // 归一化 ECEF（项目约定：Cartesian3.fromDegreesNormalized）
      const norm = (lon, lat, h = 0) => C3.fromDegreesNormalized(lon, lat, h);
      const entities = viewer.scene.entities;
      const CRUISE = 20_000;                      // 前端近似回退时的巡航高度 20 km
      const SAMPLES = 120;

      // ── 后台 PostGIS 路网 Dijkstra API ───────────────────────────────
      const API_ROUTE = 'http://localhost:8892/api/v1/spatial/route';
      const FETCH_TIMEOUT_MS = 30_000;

      /** POST JSON 并校验 {success, result|error} 包络；非 2xx/失败/超时均抛错 */
      async function postSpatial(url, body) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
        try {
          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: ctrl.signal,
          });
          const data = await resp.json().catch(() => null);
          if (!resp.ok || !data || data.success !== true || !data.result) {
            const msg = data && data.error && data.error.message
              ? data.error.message : `HTTP ${resp.status}`;
            throw new Error(msg);
          }
          return data.result;
        } finally {
          clearTimeout(timer);
        }
      }

      function errReason(err) {
        return err && err.name === 'AbortError'
          ? '请求超时(30s)' : (err && err.message) || String(err);
      }

      // ── 预设途经点：武汉路网内（114.20–114.40°E / 30.49–30.69°N）─────
      const PRESET = [
        { name: '汉口江滩', lon: 114.29, lat: 30.58 },
        { name: '江汉路', lon: 114.30, lat: 30.59 },
        { name: '武昌', lon: 114.31, lat: 30.60 },
      ];
      let waypoints = PRESET.map((p) => ({ ...p }));
      let routeEnts = [];

      function pickLonLat(px, py) {
        const w = viewer.canvas.clientWidth;
        const h = viewer.canvas.clientHeight;
        const hit = viewer.camera.pickGlobe((px / w) * 2 - 1, 1 - (py / h) * 2);
        if (!hit) return null;
        return {
          lon: (Math.atan2(hit.y, hit.x) * 180) / Math.PI,
          lat: (Math.atan2(hit.z, Math.hypot(hit.x, hit.y)) * 180) / Math.PI,
        };
      }

      function clearRoute() {
        for (const e of routeEnts) entities.remove(e);
        routeEnts = [];
      }

      /** 途经点标牌 + 到地面垂线（heightM 为 0 时省略垂线）
       * Q4 精修：标记 12px；标签按序号错开偏移 + 引线，避免垂直堆叠重叠 */
      function drawWaypointMarkers(wps, heightM) {
        wps.forEach((p, i) => {
          // 标签错开：偶数航点标签在右上、奇数在左下，拉开垂直堆叠
          const offX = i % 2 === 0 ? 46 : -46;
          const offY = i % 2 === 0 ? -30 : 34;
          routeEnts.push(entities.add(new engine.Entity({
            position: norm(p.lon, p.lat, heightM),
            point: {
              color: i === 0 || i === wps.length - 1
                ? engine.Color.RED : engine.Color.YELLOW,
              pixelSize: 12,
            },
            label: {
              text: `${i + 1} ${p.name}`,
              font: '14px sans-serif',
              fillColor: engine.Color.WHITE,
              pixelOffset: new engine.Cartesian2(offX, offY),
            },
          })));
          if (heightM > 0) {
            // 途经点到地面的垂线，强化高度感
            routeEnts.push(entities.add(new engine.Entity({
              polyline: {
                positions: [norm(p.lon, p.lat, heightM), norm(p.lon, p.lat, 0)],
                width: 1,
                color: new engine.Color(0.5, 0.8, 1.0, 0.35),
              },
            })));
          }
        });
      }

      /** 后台模式：渲染 PostGIS 路网路径（地表高亮绿线）+ 统计面板 */
      function renderServerRoute(r, wps) {
        const coords = r.path && Array.isArray(r.path.coordinates) ? r.path.coordinates : null;
        if (!coords || coords.length < 2) throw new Error('后台返回路径无效');
        const positions = coords.map((c) => norm(c[0], c[1], 0));
        routeEnts.push(entities.add(new engine.Entity({
          polyline: {
            positions,
            width: 5,
            color: new engine.Color(0.35, 1.0, 0.55, 0.95), // 后台：绿色高亮
          },
        })));
        drawWaypointMarkers(wps, 0);

        const legs = Array.isArray(r.legs) ? r.legs : [];
        const legLines = legs.map((leg, i) => {
          const from = leg && leg.from ? leg.from : {};
          const to = leg && leg.to ? leg.to : {};
          return ` ${i + 1}→${i + 2}  ${Number(from.lon).toFixed(4)},${Number(from.lat).toFixed(4)}` +
            ` → ${Number(to.lon).toFixed(4)},${Number(to.lat).toFixed(4)}` +
            `   ${(leg && Number(leg.length_km) || 0).toFixed(2)} km`;
        }).join('\n');
        result.textContent =
          `途经点: ${wps.length} 个   ${wps.map((p) => p.name).join(' → ')}\n` +
          `[后台 PostGIS 路网 Dijkstra]\n` +
          `总长: ${Number(r.length_km).toFixed(2)} km   路网节点: ${r.node_count} 个   分段: ${legs.length} 段\n` +
          (legLines ? `分段明细:\n${legLines}\n` : '') +
          `(路网覆盖武汉 114.20–114.40°E / 30.49–30.69°N)`;
      }

      /** 回退模式：CatmullRomSpline 平滑航线（原前端近似算法，巡航 20 km） */
      function renderFallbackRoute(wps, err) {
        const ctrlPts = wps.map((p) => norm(p.lon, p.lat, CRUISE));
        const times = wps.map((_, i) => i);
        const spline = new engine.CatmullRomSpline({ times, points: ctrlPts });

        // 采样曲线 + 累加弧长（归一化距离 × EARTH_RADIUS → 米）
        const pts = [];
        let totalM = 0;
        let prev = null;
        for (let i = 0; i <= SAMPLES; i++) {
          const t = (i / SAMPLES) * (wps.length - 1);
          const cur = spline.evaluate(t, new C3());
          if (prev) totalM += C3.distance(prev, cur) * C3.EARTH_RADIUS;
          pts.push(cur);
          prev = cur;
        }

        routeEnts.push(entities.add(new engine.Entity({
          polyline: {
            positions: pts,
            width: 3,
            color: new engine.Color(0.25, 0.9, 1.0, 0.9), // 前端近似：青
          },
        })));
        drawWaypointMarkers(wps, CRUISE);

        result.textContent =
          `途经点: ${wps.length} 个   ${wps.map((p) => p.name).join(' → ')}\n` +
          `[前端近似(离线)]   后台不可用：${errReason(err)}\n` +
          `CatmullRom 样条（${SAMPLES} 采样）巡航高度 20 km\n` +
          `航线长: ${(totalM / 1000).toFixed(1)} km（直线平滑，非路网路径）\n` +
          `(后台路网仅覆盖武汉 114.20–114.40°E / 30.49–30.69°N，途经点须落在网内)`;
      }

      // ── 重建路径：优先后台路网 Dijkstra，失败回退样条 ─────────────────
      let reqSeq = 0;
      async function rebuild() {
        const seq = ++reqSeq;
        clearRoute();
        if (waypoints.length < 2) {
          result.textContent = '至少需要 2 个途经点';
          return;
        }
        const wps = waypoints.map((p) => ({ name: p.name, lon: p.lon, lat: p.lat }));
        result.textContent = '路径分析：请求后台 PostGIS 路网 Dijkstra …';
        try {
          const r = await postSpatial(API_ROUTE, {
            waypoints: wps.map((p) => ({ lon: p.lon, lat: p.lat })),
          });
          if (seq !== reqSeq) return; // 过期结果，丢弃
          renderServerRoute(r, wps);
        } catch (err) {
          if (seq !== reqSeq) return;
          console.error('[86] 后台 route 失败，回退前端样条', err);
          renderFallbackRoute(wps, err);
        }
      }

      // ── 交互 ──────────────────────────────────────────────────────────
      let adding = false;
      const addModeBtn = addBtn('添加途经点（点击地图）', () => {
        adding = !adding;
        addModeBtn.classList.toggle('active', adding);
        if (adding) {
          result.textContent = '添加模式：点击地图追加航点（后台路网需落在武汉网格内）';
        }
      });
      addBtn('撤销最后航点', () => {
        if (waypoints.length > 2) { waypoints.pop(); rebuild(); }
      });
      addBtn('重置预设航线', () => {
        waypoints = PRESET.map((p) => ({ ...p }));
        rebuild();
      });

      const handler = new engine.ScreenSpaceEventHandler(viewer.canvas);
      handler.setInputAction((pos) => {
        if (!adding) return;
        const ll = pickLonLat(pos.x, pos.y);
        if (!ll) return;
        // 插到距点击处最近的相邻航点对之间
        let best = waypoints.length - 1;
        let bestD = Infinity;
        for (let i = 0; i < waypoints.length - 1; i++) {
          const mx = (waypoints[i].lon + waypoints[i + 1].lon) / 2;
          const my = (waypoints[i].lat + waypoints[i + 1].lat) / 2;
          const d = Math.hypot(mx - ll.lon, my - ll.lat);
          if (d < bestD) { bestD = d; best = i + 1; }
        }
        waypoints.splice(best, 0, {
          name: `P${waypoints.length + 1}`, lon: ll.lon, lat: ll.lat,
        });
        rebuild();
      }, 'LEFT_CLICK');

      rebuild();

      viewer.camera.setView({
        destination: C3.fromDegrees(114.30, 30.59, 50_000),
      });
    }

    // ── 标准启动模板（异步 IIFE：ES module 顶层不允许 return）────────
    (async () => {
      let viewer;
      try {
        ({ viewer } = await DemoUtils.startup({
          engine,
          view: [114.30, 30.59, 50_000],
          imagery: 'tianditu',
          title: '86 · 路径分析',
        }));
      } catch (err) {
        window.__DEMO_OK = false;
        return; // 错误面板已由 DemoUtils 显示（无 WebGPU 环境属正常降级）
      }
      try {
        await demo(viewer, engine);
        DemoUtils.showCode(demo, '86 路径分析 · 核心代码');
        window.__DEMO_OK = true;
      } catch (err) {
        window.__DEMO_OK = false;
        DemoUtils.showError('示例逻辑执行失败', err);
      }
    })();
  </script>
</body>
</html>
